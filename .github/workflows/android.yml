name: Android Bootstrap

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        run: gradle test --stacktrace

      - name: Instrumented Room and bootstrap tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          script: gradle connectedOperationalDebugAndroidTest :data:connectedDebugAndroidTest --stacktrace

      - name: Build operational debug
        run: gradle assembleOperationalDebug --stacktrace

      - name: Upload operational APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f21-campo-operational-debug-apk
          path: app/build/outputs/apk/operational/debug/*.apk
          if-no-files-found: error

      - name: Upload Room schemas
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f21-campo-room-schemas
          path: data/schemas/**/*.json
          if-no-files-found: error
