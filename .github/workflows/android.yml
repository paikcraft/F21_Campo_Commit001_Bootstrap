name: Android Bootstrap

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        run: gradle test --stacktrace

      - name: Build operational debug
        run: gradle assembleOperationalDebug --stacktrace

      - name: Build lab debug
        run: gradle assembleLabDebug --stacktrace
